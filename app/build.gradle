plugins {
    id 'com.android.application'
}

def signingStorePath = System.getenv('TR2_KEYSTORE_PATH')
def signingStorePassword = System.getenv('TR2_STORE_PASSWORD')
def signingKeyAlias = System.getenv('TR2_KEY_ALIAS')
def signingKeyPassword = System.getenv('TR2_KEY_PASSWORD')
def hasReleaseSigning = signingStorePath && signingStorePassword && signingKeyAlias && signingKeyPassword

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

android {
    namespace 'pl.edwin.trener2'
    compileSdk 35

    defaultConfig {
        applicationId 'pl.edwin.trener2'
        minSdk 26
        targetSdk 35
        versionCode 63
        versionName '0.8.2.9'
        buildConfigField "String", "UPDATE_CHANNEL", '"beta"'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(signingStorePath)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
}
