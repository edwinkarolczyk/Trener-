    compileSdk 35

    defaultConfig {
        applicationId 'pl.edwin.trener2lite'
        minSdk 22
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
