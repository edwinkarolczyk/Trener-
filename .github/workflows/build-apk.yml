name: Build Trener APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: trener2-main-release
  cancel-in-progress: true

permissions:
  contents: write

env:
  TR2_EXPECTED_SHA256: 30:68:33:34:5C:88:E2:34:4A:5A:0C:BC:51:F6:01:97:69:31:E7:24:CF:95:67:FE:6B:70:D1:59:86:56:69:CB

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/update-addon.js
          node --check app/src/main/assets/qr-addon.js
          node --check app/src/main/assets/progression-addon.js
          node --check app/src/main/assets/v050-addon.js
          node --check app/src/main/assets/v054-addon.js
          node --check app/src/main/assets/v055-workout-ui.js
          node --check app/src/main/assets/v056-visuals.js
          node --check app/src/main/assets/feature-loader.js
          node --check app/src/main/assets/v058-smart-set.js
          node --check app/src/main/assets/v059-readiness.js
          node --check app/src/main/assets/v060-equipment.js
          node --check app/src/main/assets/v061-progress-charts.js
          node --check app/src/main/assets/v062-compact-workout.js
          node --check app/src/main/assets/v063-rest-focus.js
          node --check app/src/main/assets/v0631-workout-scroll-ui.js
          node --check app/src/main/assets/v0632-duo-guard.js
          node --check app/src/main/assets/v0634-ai-visuals.js
          node --check app/src/main/assets/v0635-duo-profile-finish.js
          node --check app/src/main/assets/v0636-feedback.js
          node --check app/src/main/assets/backup-addon.js
          node --check app/src/main/assets/exercise-visuals.js
          node --check app/src/main/assets/live-status.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare durable release signing
        id: signing
        env:
          TR2_KEYSTORE_B64: ${{ secrets.TR2_KEYSTORE_B64 }}
          TR2_STORE_PASSWORD: ${{ secrets.TR2_STORE_PASSWORD }}
          TR2_KEY_ALIAS: ${{ secrets.TR2_KEY_ALIAS }}
          TR2_KEY_PASSWORD: ${{ secrets.TR2_KEY_PASSWORD }}
        run: |
          if [ -z "$TR2_KEYSTORE_B64" ] || [ -z "$TR2_STORE_PASSWORD" ] || [ -z "$TR2_KEY_ALIAS" ] || [ -z "$TR2_KEY_PASSWORD" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not configured yet; no release will be published." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          SIGN_DIR="$RUNNER_TEMP/trener2-signing"
          mkdir -p "$SIGN_DIR"
          KEYSTORE="$SIGN_DIR/trener2-release.jks"
          printf '%s' "$TR2_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          ACTUAL_SHA256=$(keytool -list -v -keystore "$KEYSTORE" -storepass "$TR2_STORE_PASSWORD" -alias "$TR2_KEY_ALIAS" | awk '/SHA256:/{print $2; exit}')
          if [ "$ACTUAL_SHA256" != "$TR2_EXPECTED_SHA256" ]; then
            echo "Signing certificate mismatch. Expected $TR2_EXPECTED_SHA256, got $ACTUAL_SHA256" >&2
            exit 1
          fi
          echo "TR2_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "TR2_STORE_PASSWORD=$TR2_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "TR2_KEY_ALIAS=$TR2_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "TR2_KEY_PASSWORD=$TR2_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Release signing certificate verified: $ACTUAL_SHA256" >> "$GITHUB_STEP_SUMMARY"

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build signed release APK
        if: steps.signing.outputs.ready == 'true'
        run: gradle assembleRelease --stacktrace

      - name: Verify APK signing certificate
        if: steps.signing.outputs.ready == 'true'
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          ACTUAL_SHA256=$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print toupper($2); exit}' | sed 's/../&:/g;s/:$//')
          if [ "$ACTUAL_SHA256" != "$TR2_EXPECTED_SHA256" ]; then
            echo "APK certificate mismatch. Expected $TR2_EXPECTED_SHA256, got $ACTUAL_SHA256" >&2
            exit 1
          fi
          echo "Signed APK certificate verified: $ACTUAL_SHA256" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare versioned APK
        if: steps.signing.outputs.ready == 'true'
        run: |
          VERSION=$(grep -m1 "versionName" app/build.gradle | sed -E "s/.*versionName[[:space:]]+'([^']+)'.*/\1/")
          VERSION_CODE=$(grep -m1 "versionCode" app/build.gradle | awk '{print $2}')
          APK_NAME="Trener2-v${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Publish version release
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}"
          publish_release() {
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "$APK_NAME" --clobber
              gh release edit "$TAG" --draft=false --latest
            else
              gh release create "$TAG" "$APK_NAME" --target "$GITHUB_SHA" --title "Trener 2 ${VERSION}" --notes "Signed release build Trener 2 ${VERSION}. Future updates use the same release certificate." --latest
            fi
          }
          for attempt in 1 2 3; do
            if publish_release; then exit 0; fi
            echo "GitHub release attempt $attempt failed; retrying shortly..." >&2
            sleep $((attempt * 4))
          done
          echo "GitHub release publishing failed after 3 attempts." >&2
          exit 1

      - name: Update updater metadata
        if: steps.signing.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          CURRENT_CODE=$(python3 -c "import json; print(json.load(open('update.json')).get('versionCode',0))" 2>/dev/null || echo 0)
          if [ "$CURRENT_CODE" -gt "$VERSION_CODE" ]; then
            echo "Updater metadata already points to newer versionCode $CURRENT_CODE; refusing downgrade to $VERSION_CODE."
            exit 0
          fi
          cat > update.json <<EOF
          {
            "version": "${VERSION}",
            "versionCode": ${VERSION_CODE},
            "title": "Trener 2 v${VERSION}",
            "notes": [
              "Najnowsza stabilna wersja Trener 2",
              "Metadane aktualizacji są synchronizowane automatycznie z każdym wydaniem"
            ],
            "pageUrl": "https://github.com/edwinkarolczyk/Trener-/releases/tag/v${VERSION}",
            "apkUrl": "https://github.com/edwinkarolczyk/Trener-/releases/download/v${VERSION}/Trener2-v${VERSION}.apk"
          }
          EOF
          if git diff --quiet -- update.json; then
            echo "Updater metadata is already current."
            exit 0
          fi
          git add update.json
          git commit -m "Update updater metadata to v${VERSION} [skip ci]"
          git push origin HEAD:main

      - name: Upload signed APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Trener2-v${{ env.VERSION }}
          path: ${{ env.APK_NAME }}
          retention-days: 30

      - name: Signing setup pending
        if: steps.signing.outputs.ready != 'true'
        run: echo "Configure TR2_KEYSTORE_B64, TR2_STORE_PASSWORD, TR2_KEY_ALIAS and TR2_KEY_PASSWORD to publish signed updates."
