name: Publish Trener 0.8.2 Legacy Updater Bridge

on:
  push:
    branches:
      - 'beta/0.7.0'
    paths:
      - '.github/workflows/publish-legacy-082-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Download tested 0.8.2 release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p bridge
          gh release download v0.8.2 --repo "$GITHUB_REPOSITORY" --dir bridge --pattern '*.apk'
          gh release download v0.8.2 --repo "$GITHUB_REPOSITORY" --dir bridge --pattern '*.sha256' || true
          test -n "$(find bridge -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Publish legacy updater bridge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="v0.8.2-legacy-beta"
          NOTES=$(cat <<'EOF'
          - Techniczny most aktualizacji wyłącznie dla starszych wersji 0.8-beta.x.
          - Instalowane APK ma właściwą wersję 0.8.2 i versionCode 54.
          - Po przejściu na 0.8.2 dalsze aktualizacje używają czystej numeracji.
          EOF
          )
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" bridge/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Trener 2 0.8.2" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" bridge/* --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Trener 2 0.8.2" \
              --notes "$NOTES" \
              --prerelease
          fi
