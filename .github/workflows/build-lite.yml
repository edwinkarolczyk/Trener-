name: Build Trener 2 Lite (Fire OS 5)
on:
  push:
    branches: [feature/trener2-lite-fire5]
    paths:
      - 'lite/**'
      - 'settings.gradle'
      - '.github/workflows/build-lite.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Zainstaluj Android 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Zbuduj Lite Debug APK (minSdk 22)
        run: gradle :lite:assembleDebug --no-daemon
      - name: Opublikuj instalator APK
        uses: actions/upload-artifact@v4
        with:
          name: Trener2-Lite-FireOS5-debug
          path: lite/build/outputs/apk/debug/lite-debug.apk
          retention-days: 30
