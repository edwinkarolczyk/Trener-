name: Build Trener 2 Lite (Fire OS 5)
# Wydanie 0.4.2 (16+) dopiero po testach i podpisaniu na gałęzi Lite.
on:
  push:
    branches: [feature/trener2-lite-fire5]
    paths:
      - 'lite/**'
      - '.github/workflows/build-lite.yml'
  workflow_dispatch:

concurrency:
  group: trener2-lite-release
  cancel-in-progress: true

permissions:
  contents: write

env:
  TR2_EXPECTED_SHA256: 30:68:33:34:5C:88:E2:34:4A:5A:0C:BC:51:F6:01:97:69:31:E7:24:CF:95:67:FE:6B:70:D1:59:86:56:69:CB

jobs:
  lite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Zainstaluj Android 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Przygotuj trwały podpis APK
        env:
          TR2_KEYSTORE_B64: ${{ secrets.TR2_KEYSTORE_B64 }}
          TR2_STORE_PASSWORD: ${{ secrets.TR2_STORE_PASSWORD }}
          TR2_KEY_ALIAS: ${{ secrets.TR2_KEY_ALIAS }}
          TR2_KEY_PASSWORD: ${{ secrets.TR2_KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$TR2_KEYSTORE_B64" && test -n "$TR2_STORE_PASSWORD" && test -n "$TR2_KEY_ALIAS" && test -n "$TR2_KEY_PASSWORD" || { echo "Brak klucza stałego podpisu" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/lite-signing"
          KEYSTORE="$RUNNER_TEMP/lite-signing/release.jks"
          printf '%s' "$TR2_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          ACTUAL=$(keytool -list -v -keystore "$KEYSTORE" -storepass "$TR2_STORE_PASSWORD" -alias "$TR2_KEY_ALIAS" | awk '/SHA256:/{print $2; exit}')
          test "$ACTUAL" = "$TR2_EXPECTED_SHA256" || { echo "Certyfikat niezgodny: $ACTUAL" >&2; exit 1; }
          echo "TR2_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "TR2_STORE_PASSWORD=$TR2_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "TR2_KEY_ALIAS=$TR2_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "TR2_KEY_PASSWORD=$TR2_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Przygotuj transpilację WebView Android 5
        run: |
          cd lite
          npm install --no-save --no-package-lock --ignore-scripts @babel/core @babel/preset-env core-js-bundle
      - name: Sprawdź oryginalny silnik i motyw Trenera 2
        run: |
          node lite/scripts/build-parity-assets.cjs
          node --check lite/build/generated/parityAssets/app.js
          node --check lite/build/generated/parityAssets/feature-loader.js
          node --check lite/build/generated/parityAssets/v086-one-phone.js
          node --check lite/build/generated/parityAssets/lite-group-core.js
          node --check lite/build/generated/parityAssets/lite-inventory-core.js
          node --check lite/build/generated/parityAssets/lite-inventory-ui.js
          node --check lite/build/generated/parityAssets/lite-fire-ui-core.js
          node --check lite/build/generated/parityAssets/lite-fire-ui.js
          node --check lite/build/generated/parityAssets/lite-exercise-core.js
          node --check lite/build/generated/parityAssets/lite-exercise-import.js
          node --check lite/build/generated/parityAssets/lite-profile-core.js
          node --check lite/build/generated/parityAssets/lite-profile-ui.js
          node --check lite/build/generated/parityAssets/lite-040-core.js
          node --check lite/build/generated/parityAssets/lite-040-ui.js
          grep -q 'lite-040-ui.js' lite/build/generated/parityAssets/index.html
          grep -q 'lite-profile-ui.js' lite/build/generated/parityAssets/index.html
          grep -q 'window.TrenerLiteProfiles' lite/build/generated/parityAssets/v086-one-phone.js
          grep -q 'lite-exercise-import.js' lite/build/generated/parityAssets/index.html
          grep -q 'tabletState' lite/build/generated/parityAssets/v086-one-phone.js
          grep -q 'lite-fire-ui.js' lite/build/generated/parityAssets/index.html
          grep -q 'lite-fire.css' lite/build/generated/parityAssets/index.html
          test -s lite/build/generated/parityAssets/lite-fire.css
          grep -q 'lite-inventory-core.js' lite/build/generated/parityAssets/index.html
          grep -q 'lite-inventory-ui.js' lite/build/generated/parityAssets/index.html
          ! grep -q 'v060-equipment.js' lite/build/generated/parityAssets/feature-loader.js
          grep -q 'TRENING 1–6 OSÓB' lite/build/generated/parityAssets/v086-one-phone.js
          grep -q 'state.plans' lite/build/generated/parityAssets/v086-one-phone.js
          node --check lite/build/generated/parityAssets/lite-pr-core.js
          node --check lite/build/generated/parityAssets/lite-pr.js
          node --check lite/build/generated/parityAssets/lite-data-core.js
          node --check lite/build/generated/parityAssets/lite-data-manager.js
          node --check lite/build/generated/parityAssets/lite-init.js
          grep -q 'lite-data-manager.js' lite/build/generated/parityAssets/index.html
          grep -q 'lite-pr.js' lite/build/generated/parityAssets/index.html
          test -s lite/build/generated/parityAssets/style.css
          test -s lite/build/generated/parityAssets/lite-tablet.css
          grep -q '#start #setup .modeRow' lite/build/generated/parityAssets/lite-tablet.css
          grep -q 'Trening 1–6 osób' lite/build/generated/parityAssets/index.html
          ! grep -q 'v076-diet.js' lite/build/generated/parityAssets/feature-loader.js
      - name: Testy bezpieczeństwa kopii, migracji i rekordów
        run: node --test lite/tests/pr-core.test.cjs lite/tests/data-safety.test.cjs lite/tests/group-six.test.cjs lite/tests/inventory.test.cjs lite/tests/fire-ui.test.cjs lite/tests/exercise-import.test.cjs lite/tests/profile-lock.test.cjs lite/tests/start-unified.test.cjs lite/tests/installer-fire5.test.cjs
      - name: Testy nowego interfejsu, planów i historii 0.4.2
        run: node --test lite/scripts/lite-040-core.test.cjs lite/tests/lite040-ui-contract.test.cjs
      - name: Testy regresyjne treningu i progresji
        run: gradle :lite:testDebugUnitTest --no-daemon
      - name: Zbuduj podpisany Lite (minSdk 21)
        run: gradle :lite:assembleRelease --no-daemon
      - name: Weryfikuj podpis i Android 5.1
        run: |
          APK=lite/build/outputs/apk/release/lite-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --min-sdk-version 21 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 21 "$APK" | grep -F "Verified using v1 scheme (JAR signing): true"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "sdkVersion:'21'"
          ACTUAL=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print toupper($2); exit}' | sed 's/../&:/g;s/:$//')
          test "$ACTUAL" = "$TR2_EXPECTED_SHA256" || exit 1
      - name: Opublikuj wydanie Trener 2 Lite w GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n "s/.*versionName[[:space:]]*'\\([^']*\\)'.*/\\1/p" lite/build.gradle | head -1)
          CODE=$(awk '/versionCode/{print $2; exit}' lite/build.gradle)
          test -n "$VERSION" && test -n "$CODE"
          test "$VERSION" = "0.4.2" && test "$CODE" -gt 15 || { echo 'Blokada publikacji: wydanie 0.4.2 wymaga testów.' >&2; exit 1; }
          TAG="lite-v${VERSION}"
          APK_NAME="Trener2-Lite-v${VERSION}.apk"
          cp lite/build/outputs/apk/release/lite-release.apk "$APK_NAME"
          SHA=$(sha256sum "$APK_NAME" | awk '{print $1}')
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" --clobber
          else
            gh release create "$TAG" "$APK_NAME" --target "$GITHUB_SHA" --title "Trener 2 Lite ${VERSION} (Fire OS 5)" --notes "Podpisane APK do aktualizacji bez utraty historii treningów. Android 5.1 i nowsze. Potwierdź instalację w systemie." --prerelease
          fi
          echo "LITE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "LITE_CODE=$CODE" >> "$GITHUB_ENV"
          echo "LITE_SHA=$SHA" >> "$GITHUB_ENV"
      - name: Uaktualnij manifest dla tabletu (bez zmiany danych)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$GITHUB_REF_NAME"
          git pull --rebase origin "$GITHUB_REF_NAME"
          cat > lite/update.json <<EOF
          {
            "versionCode": ${LITE_CODE},
            "versionName": "${LITE_VERSION}",
            "minSdk": 21,
            "apkUrl": "https://github.com/edwinkarolczyk/Trener-/releases/download/lite-v${LITE_VERSION}/Trener2-Lite-v${LITE_VERSION}.apk",
            "sha256": "${LITE_SHA}",
            "notes": "Nowa wersja Lite dla tabletu. Wszystkie profile, plany, ciezary i historia zostaja zachowane."
          }
          EOF
          if ! git diff --quiet -- lite/update.json || [ -n "$(git ls-files --others --exclude-standard lite/update.json)" ]; then
            git add lite/update.json
            git commit -m "Update Lite manifest to ${LITE_VERSION} [skip ci]"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Opublikuj podpisany APK
        uses: actions/upload-artifact@v4
        with:
          name: Trener2-Lite-FireOS5-signed
          path: lite/build/outputs/apk/release/lite-release.apk
          retention-days: 30
